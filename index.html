<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Pos dan ekspedisi Pontianak Timur</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
  :root { --ink: #12343b; --muted: #5b6f73; --line: #dde5e6; --bg: #f6f9f8; --focus: #1864ab; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; color: var(--ink);
         font: 14px/1.45 'Plus Jakarta Sans', system-ui, sans-serif; }
  #map { flex: 1; }
  .leaflet-container { font-family: inherit; }

  #side { width: 340px; flex: none; display: flex; flex-direction: column; background: var(--bg);
          border-right: 1px solid var(--line); z-index: 1000; }
  #head { padding: 18px 18px 14px; }
  h1 { margin: 0; font-size: 19px; line-height: 1.25; font-weight: 700; }
  #head p { margin: 4px 0 0; color: var(--muted); }
  section { padding: 12px 18px; border-top: 1px solid var(--line); }
  h2 { margin: 0 0 4px; font-size: 13px; font-weight: 700; }

  .row { display: flex; align-items: center; gap: 9px; padding: 5px 0; cursor: pointer; }
  .row input { width: 16px; height: 16px; margin: 0; accent-color: var(--ink); }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .legend { display: flex; gap: 14px; margin-top: 8px; color: var(--muted); font-size: 12.5px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .mk { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); }
  .mk.on { background: var(--ink); }

  #res { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-bottom: 0; }
  #count { color: var(--muted); margin-bottom: 6px; }
  #list { flex: 1; overflow: auto; margin: 0 -18px; }
  .item { display: flex; gap: 10px; align-items: flex-start; width: 100%; padding: 9px 18px; border: 0;
          border-top: 1px solid var(--line); background: none; font: inherit; color: inherit;
          text-align: left; cursor: pointer; }
  .item:hover { background: #e9f0ef; }
  .item .dot { margin-top: 4px; }
  .item small { display: block; color: var(--muted); }
  .empty { padding: 10px 18px; color: var(--muted); }

  .pop b { display: block; margin-bottom: 2px; font-size: 14px; }
  .pop small { color: var(--muted); }
  .cl { background: var(--ink); color: #fff; border: 2px solid #fff; border-radius: 50%;
        text-align: center; line-height: 34px; font-weight: 700; }
  button:focus-visible, .row:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }

  @media (max-width: 720px) {
    body { flex-direction: column-reverse; }
    #side { width: 100%; height: 48vh; overflow: auto; border-right: 0; border-top: 1px solid var(--line); }
    #res { flex: none; }
    #list { overflow: visible; }
  }
</style>
</head>
<body>
<div id="map"></div>

<aside id="side">
  <div id="head">
    <h1>Pos dan ekspedisi di Pontianak Timur</h1>
    <p>Pilih penyedia untuk melihat sebaran titiknya.</p>
  </div>
  <section>
    <h2>Penyedia</h2>
    <div id="chk"></div>
  </section>
  <section>
    <h2>Tampilan</h2>
    <label class="row"><input type="checkbox" id="pickupOnly"> Hanya yang melayani pickup</label>
    <label class="row"><input type="checkbox" id="cluster"> Gabungkan titik berdekatan (cluster)</label>
    <label class="row"><input type="checkbox" id="komersial" checked><span class="dot" style="background:#d6336c33;border:2px solid #d6336c;border-radius:3px"></span>Kawasan komersial</label>
    <div class="legend">
      <span><i class="mk on"></i>Melayani pickup</span>
      <span><i class="mk"></i>Tanpa pickup</span>
    </div>
  </section>
  <section id="res">
    <div id="count">Memuat data...</div>
    <div id="list"></div>
  </section>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
  // Warna per penyedia. Samakan dengan Categorized Symbology di QGIS (SK-2).
  const COLOR = { pos: '#e8710a', jne: '#1864ab', jnt: '#c92a2a', sicepat: '#7048e8', lainnya: '#2b8a3e' };
  const NAMA  = { pos: 'Pos Indonesia', jne: 'JNE', jnt: 'J&T', sicepat: 'SiCepat', lainnya: 'Lainnya' };

  // Nilai kolom "penyedia" (Pos, JNE, J&T, SiCepat, Anteraja, ...) menjadi kunci state.
  function keyOf(penyedia) {
    const s = String(penyedia || '').toLowerCase().replace(/[^a-z]/g, '');
    if (s.includes('pos'))     return 'pos';
    if (s.includes('jne'))     return 'jne';
    if (/^(jt|jnt)/.test(s))   return 'jnt';
    if (s.includes('sicepat')) return 'sicepat';
    return 'lainnya';
  }
  const isPickup = p => String(p.pickup).trim().toLowerCase() === 'ya';

  // State terpusat: tampilan peta dan daftar selalu dihitung dari objek ini.
  const state = {
    filters: { pos: true, jne: true, jnt: true, sicepat: true, lainnya: true },
    cluster: false,
    pickupOnly: false
  };

  const $ = id => document.getElementById(id);
  let data = null, layer = null;

  const map = L.map('map', { zoomControl: false }).setView([-0.03, 109.36], 14);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  const popup = p => `<div class="pop"><b>${p.nama}</b>${p.penyedia}, ${p.layanan}<br>` +
    `Buka ${p.jam_operasional}<br>${isPickup(p) ? 'Melayani pickup' : 'Tanpa pickup'}` +
    (p.kode_ekspedisi ? `<br><small>${p.kode_ekspedisi}</small>` : '') + `</div>`;

  function fokus(m) {
    if (state.cluster) layer.zoomToShowLayer(m, () => m.openPopup());
    else { map.setView(m.getLatLng(), Math.max(map.getZoom(), 16)); m.openPopup(); }
  }

  function renderEkspedisi() {
    if (!data) return;
    if (layer) map.removeLayer(layer);

    const gj = L.geoJSON(data, {
      filter: f => state.filters[keyOf(f.properties.penyedia)] && (!state.pickupOnly || isPickup(f.properties)),
      pointToLayer: (f, ll) => {
        const c = COLOR[keyOf(f.properties.penyedia)], on = isPickup(f.properties);
        // Terisi penuh = melayani pickup, berongga = tanpa pickup
        return L.circleMarker(ll, { radius: 9, weight: 2.5, color: on ? '#fff' : c, fillColor: c, fillOpacity: on ? 0.95 : 0.2 });
      },
      onEachFeature: (f, l) => l.bindPopup(popup(f.properties))
    });

    if (state.cluster) {
      layer = L.markerClusterGroup({
        iconCreateFunction: c => L.divIcon({ html: c.getChildCount(), className: 'cl', iconSize: [38, 38] })
      });
      layer.addLayer(gj);
    } else layer = gj;
    layer.addTo(map);

    const items = gj.getLayers();
    $('count').textContent = `${items.length} dari ${data.features.length} titik tampil`;
    const list = $('list');
    list.innerHTML = items.length ? '' : '<div class="empty">Tidak ada titik yang cocok. Aktifkan minimal satu penyedia.</div>';
    items.forEach(m => {
      const p = m.feature.properties, b = document.createElement('button');
      b.className = 'item';
      b.innerHTML = `<span class="dot" style="background:${COLOR[keyOf(p.penyedia)]}"></span>` +
                    `<span><b>${p.nama}</b><small>${p.layanan}, ${p.jam_operasional}</small></span>`;
      b.onclick = () => fokus(m);
      list.appendChild(b);
    });
  }

  // Daftar penyedia dibuat dari NAMA supaya tidak ditulis berulang.
  for (const k in NAMA) {
    $('chk').insertAdjacentHTML('beforeend',
      `<label class="row"><input type="checkbox" data-k="${k}" checked>` +
      `<span class="dot" style="background:${COLOR[k]}"></span>${NAMA[k]}<span class="n" id="n-${k}"></span></label>`);
  }

  // Event: ubah state dulu, lalu render ulang.
  $('chk').onchange = e => { state.filters[e.target.dataset.k] = e.target.checked; renderEkspedisi(); };
  $('pickupOnly').onchange = e => { state.pickupOnly = e.target.checked; renderEkspedisi(); };
  $('cluster').onchange = e => { state.cluster = e.target.checked; renderEkspedisi(); };

  fetch('/api/data/ekspedisi')
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => {
      data = d;
      const jumlah = {};
      d.features.forEach(f => { const k = keyOf(f.properties.penyedia); jumlah[k] = (jumlah[k] || 0) + 1; });
      for (const k in NAMA) $('n-' + k).textContent = jumlah[k] || 0;
      renderEkspedisi();
      const b = L.geoJSON(d).getBounds();
      if (b.isValid()) map.fitBounds(b.pad(0.1));
    })
    .catch(err => {
      $('count').textContent = 'Data belum bisa dimuat (' + err.message + '). Pastikan server backend sudah berjalan, lalu buka halaman lewat alamat server.';
    });

  // Zona logistik dari QGIS. Dilewati diam-diam jika file tidak disajikan backend.
  fetch('zona_logistik.geojson')
    .then(r => r.json())
    .then(z => L.geoJSON(z, {
      style: { color: '#12343b', weight: 1.5, dashArray: '5 4', fillOpacity: 0.07 },
      onEachFeature: (f, l) => l.bindTooltip(f.properties.nama || 'Zona logistik', { sticky: true })
    }).addTo(map).bringToBack())
    .catch(() => {});

  // Kawasan komersial (hasil ekspor kawasan_komersial.gpkg ke GeoJSON).
  // Pane khusus supaya selalu berada di bawah titik dan zona.
  map.createPane('komersial').style.zIndex = 390;
  const komersial = L.layerGroup().addTo(map);

  fetch('kawasan_komersial.geojson')
    .then(r => r.json())
    .then(k => L.geoJSON(k, {
      pane: 'komersial',
      style: { color: '#d6336c', weight: 2, fillOpacity: 0.15 },
      onEachFeature: (f, l) => l.bindTooltip(f.properties.nama, { sticky: true })
    }).addTo(komersial))
    .catch(() => {});

  $('komersial').onchange = e => e.target.checked ? komersial.addTo(map) : map.removeLayer(komersial);
</script>
</body>
</html>
