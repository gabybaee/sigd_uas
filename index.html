<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Ekspedisi Pontianak Timur</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>body{margin:0;font:14px system-ui}#map{height:100vh}
#panel{position:absolute;z-index:1000;top:10px;right:10px;background:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 1px 6px #0004}
#panel label{display:block;margin:2px 0}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.cl{background:#1d4e89;color:#fff;border-radius:50%;text-align:center;line-height:34px;font-weight:600;border:2px solid #fff}</style></head><body>
<div id="map"></div>
<div id="panel"><b>Penyedia</b><div id="chk"></div><hr>
<label><input type="checkbox" id="pickupOnly"> Hanya pickup</label>
<label><input type="checkbox" id="cluster"> Cluster</label><div id="count"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const COLOR={pos:'#e8590c',jne:'#1971c2',jnt:'#e03131',sicepat:'#c2255c',lainnya:'#2f9e44'};
const NAMA={pos:'Pos',jne:'JNE',jnt:'J&T',sicepat:'SiCepat',lainnya:'Lainnya'};
const keyOf=p=>({'Pos':'pos','JNE':'jne','J&T':'jnt','SiCepat':'sicepat'}[p]||'lainnya');
const state={filters:{pos:true,jne:true,jnt:true,sicepat:true,lainnya:true},cluster:false,pickupOnly:false};
let data=null,layer=null;
const map=L.map('map').setView([-0.030,109.360],14);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
function renderEkspedisi(){
  if(layer)map.removeLayer(layer);
  const ok=f=>state.filters[keyOf(f.properties.penyedia)]&&(!state.pickupOnly||f.properties.pickup==='Ya');
  const gj=L.geoJSON(data,{filter:ok,
    pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:8,color:'#fff',weight:2,fillColor:COLOR[keyOf(f.properties.penyedia)],fillOpacity:.9}),
    onEachFeature:(f,l)=>{const p=f.properties;l.bindPopup(`<b>${p.nama}</b><br>${p.kode_ekspedisi}<br>${p.jam_operasional} · Pickup: ${p.pickup}`)}});
  if(state.cluster){layer=L.markerClusterGroup({iconCreateFunction:c=>L.divIcon({html:c.getChildCount(),className:'cl',iconSize:[38,38]})});layer.addLayer(gj)}
  else layer=gj;
  layer.addTo(map);
  document.getElementById('count').textContent=gj.getLayers().length+' lokasi tampil';
}
const chk=document.getElementById('chk');
for(const k in NAMA){chk.insertAdjacentHTML('beforeend',`<label><input type="checkbox" data-k="${k}" checked><span class="dot" style="background:${COLOR[k]}"></span>${NAMA[k]}</label>`)}
chk.onchange=e=>{state.filters[e.target.dataset.k]=e.target.checked;renderEkspedisi()};
pickupOnly.onchange=e=>{state.pickupOnly=e.target.checked;renderEkspedisi()};
cluster.onchange=e=>{state.cluster=e.target.checked;renderEkspedisi()};
fetch('/api/data/ekspedisi').then(r=>r.json()).then(d=>{data=d;renderEkspedisi()});
fetch('zona_logistik.geojson').then(r=>r.json()).then(z=>L.geoJSON(z,{style:{color:'#555',dashArray:'4',fillOpacity:.08}}).addTo(map));
</script></body></html>
